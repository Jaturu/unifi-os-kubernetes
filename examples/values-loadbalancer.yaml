# Example values: bare-metal cluster with MetalLB providing a LoadBalancer IP.
# All UOS ports are exposed via a single LoadBalancer per service.

systemIp: unifi.example.com

service:
  type: LoadBalancer
  loadBalancerIP: 192.0.2.10
  # One Service is created per port, all requesting the same IP. MetalLB
  # only lets them share it when they carry the same sharing key, and
  # shared-IP services need externalTrafficPolicy: Cluster.
  annotations:
    metallb.universe.tf/allow-shared-ip: unifi
  externalTrafficPolicy: Cluster
  # Label every service so an IP-pool controller can select them. Cilium's
  # LoadBalancerIPPool `serviceSelector` is a label selector and cannot read
  # annotations, so this is the only hook that works there. Drop this block if
  # your LB controller assigns from a default pool.
  labels:
    io.cilium/lb-ipam-pool: unifi

ports:
  webui:        { enabled: true,  port: 443,   targetPort: 443,   protocol: TCP }
  communication: { enabled: true, port: 8080,  targetPort: 8080,  protocol: TCP }
  stun:         { enabled: true,  port: 3478,  targetPort: 3478,  protocol: UDP }
  discovery:    { enabled: true,  port: 10003, targetPort: 10003, protocol: UDP }

persistence:
  data:
    storageClass: longhorn
    size: 30Gi
  mongo:
    storageClass: longhorn
    size: 10Gi
