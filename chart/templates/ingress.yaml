{{- if .Values.ingress.enabled }}
{{- $fullName := include "unifi-os-server.fullname" . -}}
{{- $svcName := printf "%s-webui" $fullName | trunc 63 | trimSuffix "-" -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "unifi-os-server.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      {{- /* Only name a Secret that exists or will be issued: an explicit
             secretName, the chart's Certificate, or cert-manager's
             ingress-shim annotations. Otherwise omit it so the ingress
             controller serves its default certificate. */}}
      {{- $ann := default (dict) .Values.ingress.annotations }}
      {{- $shim := or (hasKey $ann "cert-manager.io/cluster-issuer") (hasKey $ann "cert-manager.io/issuer") }}
      {{- if or .Values.ingress.tls.secretName .Values.certManager.enabled $shim }}
      secretName: {{ include "unifi-os-server.tlsSecretName" . }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ $svcName }}
                port:
                  number: {{ .Values.ports.webui.port }}
{{- end }}
