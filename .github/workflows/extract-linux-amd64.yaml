---
name: Extract uosserver image (linux/amd64)

# Runs the official Ubiquiti UniFi OS Server installer on a runner. The
# installer creates a `uosserver` system user and lays down a podman image at
# /home/uosserver/.local/share/containers/storage. We copy that into the
# runner's podman storage and push it to GHCR as the per-arch base image
# that our application Dockerfile builds on top of.

on:
  workflow_call:
    inputs:
      UOS_DOWNLOAD:
        required: true
        type: string
      UOS_SHA256:
        required: false
        default: ""
        type: string
    outputs:
      PODMAN_IMAGE_TAG:
        description: "Tag of the extracted uosserver image"
        value: ${{ jobs.extract-image.outputs.PODMAN_IMAGE_TAG }}
  workflow_dispatch:
    inputs:
      UOS_DOWNLOAD:
        description: "UniFi OS Server installer URL (linux-x64)"
        required: true
        type: string
      UOS_SHA256:
        description: "Expected SHA-256 of the installer (optional)"
        required: false
        default: ""
        type: string

env:
  REGISTRY: ghcr.io
  REPO_OWNER: ${{ github.repository_owner }}

jobs:
  extract-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      PODMAN_IMAGE_TAG: ${{ steps.tag.outputs.PODMAN_IMAGE_TAG }}

    steps:
      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install podman
        # GitHub-hosted ubuntu-24.04 images no longer ship podman preinstalled,
        # and the UOS installer hard-checks /usr/bin/podman before proceeding.
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          command -v podman
          podman --version

      - name: Run UniFi OS Server installer
        # The URL and checksum originate from Ubiquiti's firmware API, so
        # treat them as untrusted: pass via env (never interpolate into the
        # script), allow-list the download host, and verify the checksum
        # before running the installer as root.
        env:
          UOS_DOWNLOAD: ${{ inputs.UOS_DOWNLOAD }}
          UOS_SHA256: ${{ inputs.UOS_SHA256 }}
        run: |
          set -euo pipefail
          if ! [[ "$UOS_DOWNLOAD" =~ ^https://fw-download\.ubnt\.com/[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Refusing installer URL outside fw-download.ubnt.com: $UOS_DOWNLOAD"
            exit 1
          fi
          if [ -n "$UOS_SHA256" ] && ! [[ "$UOS_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Malformed installer SHA-256"
            exit 1
          fi
          mkdir -p /home/runner/.config/containers
          chmod 755 /home/runner /home/runner/.config /home/runner/.config/containers
          touch /home/runner/.config/containers/storage.conf
          chmod 755 /home/runner/.config/containers/storage.conf
          curl -fsSL --proto '=https' --tlsv1.2 -o unifi-os-server "$UOS_DOWNLOAD"
          if [ -n "$UOS_SHA256" ]; then
            echo "${UOS_SHA256}  unifi-os-server" | sha256sum -c -
          else
            echo "::warning::No SHA-256 supplied; installer checksum not verified"
            sha256sum unifi-os-server
          fi
          sudo chmod +x unifi-os-server
          # Installer prompts y/N to start service post-install; we don't care.
          echo "y" | sudo ./unifi-os-server || true

      - name: Move uosserver image into runner podman storage
        run: |
          for sub in overlay overlay-images overlay-layers; do
            mkdir -p "/home/runner/.local/share/containers/storage/$sub"
            sudo cp -a "/home/uosserver/.local/share/containers/storage/$sub/." \
              "/home/runner/.local/share/containers/storage/$sub/"
          done
          sudo chown -R runner:runner /home/runner/.local/share/containers/storage
          podman images

      - name: Capture upstream OCI config + drift detection
        # The application Dockerfile inherits Entrypoint/Cmd/Env/WorkingDir
        # from this image via FROM, then overrides ENTRYPOINT with our own
        # docker/entrypoint.sh (which ends in `exec /sbin/init`). This check
        # is a canary: it confirms upstream still ultimately boots systemd so
        # our entrypoint's assumptions hold. As of UOS Server 5.0.x upstream
        # no longer sets Cmd=/sbin/init directly — it boots through a wrapper
        # (Cmd=/root/uos-entrypoint.sh) that execs /sbin/init. A Cmd-level
        # check is blind to changes inside that wrapper, so when a wrapper is
        # detected we extract it, record it in the run summary, and verify it
        # still hands off to /sbin/init. Dump the upstream config too, and
        # fail loud on real drift.
        run: |
          set -euo pipefail
          PODMAN_IMAGE_ID=$(podman images uosserver --noheading | awk 'NR==1{print $3}')
          if [ -z "$PODMAN_IMAGE_ID" ]; then
            echo "uosserver image not found in podman storage" >&2
            podman images
            exit 1
          fi
          podman inspect "$PODMAN_IMAGE_ID" --format '{{json .Config}}' > /tmp/upstream-config.json

          {
            echo "## Upstream OCI image config (linux/amd64)"
            echo ""
            echo "\`\`\`json"
            jq . /tmp/upstream-config.json
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

          ENTRYPOINT=$(jq -c '.Entrypoint // []' /tmp/upstream-config.json)
          CMD=$(jq -c '.Cmd // []' /tmp/upstream-config.json)
          echo "Upstream Entrypoint: $ENTRYPOINT"
          echo "Upstream Cmd:        $CMD"

          # Accept either Entrypoint or Cmd ending in /sbin/init or init.
          COMBINED=$(jq -r '((.Entrypoint // []) + (.Cmd // [])) | join(" ")' /tmp/upstream-config.json)
          case "$COMBINED" in
            *"/sbin/init"|*" init"|"init")
              echo "Upstream boots /sbin/init directly."
              ;;
            *)
              # Upstream boots through a wrapper script rather than /sbin/init
              # directly. Follow it one level: extract the script, record it
              # for audit, and confirm it still execs /sbin/init.
              WRAPPER=$(jq -r '(.Cmd // [])[-1] // empty' /tmp/upstream-config.json)
              case "$WRAPPER" in
                /*) ;;
                *)
                  echo "::error::Upstream entrypoint changed and is not a wrapper script path: $COMBINED"
                  echo "::error::Update docker/entrypoint.sh and re-run."
                  exit 1
                  ;;
              esac
              echo "Upstream boots via wrapper: $WRAPPER — extracting to verify it execs /sbin/init"
              CID=$(podman create "$PODMAN_IMAGE_ID")
              podman cp "$CID:$WRAPPER" /tmp/upstream-entrypoint.sh
              podman rm "$CID" >/dev/null
              {
                echo ""
                echo "### Upstream wrapper entrypoint (\`$WRAPPER\`)"
                echo ""
                echo "\`\`\`bash"
                cat /tmp/upstream-entrypoint.sh
                echo "\`\`\`"
              } >> "$GITHUB_STEP_SUMMARY"
              if grep -q '/sbin/init' /tmp/upstream-entrypoint.sh; then
                echo "Wrapper hands off to /sbin/init — boot model intact."
              else
                echo "::error::Upstream wrapper $WRAPPER no longer execs /sbin/init."
                echo "::error::Boot model changed — re-review docker/entrypoint.sh and re-run."
                exit 1
              fi
              ;;
          esac

      - name: Upload upstream OCI config artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upstream-config-linux-amd64
          path: /tmp/upstream-config.json

      - name: Login to GHCR
        uses: redhat-actions/podman-login@4934294ad0449894bcd1e9f191899d7292469603 # v1.7
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.REGISTRY }}

      - name: Push uosserver image
        id: tag
        run: |
          PODMAN_IMAGE_TAG=$(podman images uosserver --noheading | awk 'NR==1{print $2}')
          PODMAN_IMAGE_ID=$(podman images uosserver --noheading | awk 'NR==1{print $3}')
          if [ -z "$PODMAN_IMAGE_TAG" ] || [ -z "$PODMAN_IMAGE_ID" ]; then
            echo "uosserver image not found in podman storage" >&2
            podman images
            exit 1
          fi
          # The tag is produced by the installer and flows into sed/Dockerfile
          # edits downstream; reject anything that isn't a plain tag.
          if ! [[ "$PODMAN_IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,100}$ ]]; then
            echo "::error::Unexpected uosserver image tag: $PODMAN_IMAGE_TAG"
            exit 1
          fi
          # Registry refs must be lowercase; the owner login may not be.
          podman push "$PODMAN_IMAGE_ID" \
            "$REGISTRY/${REPO_OWNER,,}/uosserver:${PODMAN_IMAGE_TAG}-linux-amd64"
          echo "PODMAN_IMAGE_TAG=$PODMAN_IMAGE_TAG" >> "$GITHUB_OUTPUT"
