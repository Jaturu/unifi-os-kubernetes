---
name: Build uosserver multi-arch manifest

# Combines the per-arch uosserver images extracted from the official installer
# into a single multi-arch manifest that our application Dockerfile can FROM.

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "uosserver podman tag (without -linux-* suffix)"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: uosserver

jobs:
  build-multiarch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate tag and lowercase owner
        id: prep
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,100}$ ]]; then
            echo "::error::Unexpected uosserver tag: $TAG"
            exit 1
          fi
          # Registry refs must be lowercase; the owner login may not be.
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge and push multi-arch manifest
        uses: int128/docker-manifest-create-action@a118e9fe12455375d4810aa318c20e6dba77288e # v2.29.0
        with:
          tags: |
            ${{ env.REGISTRY }}/${{ steps.prep.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}-multiarch
          sources: |
            ${{ env.REGISTRY }}/${{ steps.prep.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}-linux-amd64
            ${{ env.REGISTRY }}/${{ steps.prep.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}-linux-arm64
