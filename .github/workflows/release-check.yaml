---
name: Check for new UniFi OS Server release

# Polls Ubiquiti's official firmware-latest API for the current release-channel
# UOS version. If the version differs from what's pinned in docker/Dockerfile,
# extracts the per-arch images, builds the multi-arch manifest, and opens a PR
# updating the FROM tag and UOS_SERVER_VERSION.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Run extract+build+PR even if pinned version matches upstream"
        required: false
        default: "false"
        type: string
  schedule:
    - cron: "0 6 * * *"
  # Both bump workflows patch-bump the chart version, so when one bump PR
  # merges the other open bump PR conflicts on that line. Re-run on every
  # Chart.yaml change on main: an already-pinned version is a no-op, and a
  # still-pending bump has its PR branch rebuilt on the new main.
  push:
    branches: [main]
    paths:
      - 'chart/Chart.yaml'

# One run at a time, so a push-triggered run can't race the daily one while
# both push images and rebuild the same PR branch.
concurrency:
  group: release-check
  cancel-in-progress: false

# Least privilege: each job below declares only what it needs. The
# release-check job parses untrusted API data and gets read-only access.
permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      UOS_VERSION: ${{ steps.version.outputs.UOS_VERSION }}
      UOS_DOWNLOAD_AMD64: ${{ steps.version.outputs.UOS_DOWNLOAD_AMD64 }}
      UOS_DOWNLOAD_ARM64: ${{ steps.version.outputs.UOS_DOWNLOAD_ARM64 }}
      UOS_SHA256_AMD64: ${{ steps.version.outputs.UOS_SHA256_AMD64 }}
      UOS_SHA256_ARM64: ${{ steps.version.outputs.UOS_SHA256_ARM64 }}
      RELEASED: ${{ steps.release.outputs.released }}
    steps:
      - name: Fetch latest release metadata from Ubiquiti
        run: |
          curl -fsSL \
            "https://fw-update.ubnt.com/api/firmware-latest?filter=eq~~product~~unifi-os-server&filter=eq~~platform~~linux-x64&filter=eq~~channel~~release" \
            -o linux-amd64.json
          curl -fsSL \
            "https://fw-update.ubnt.com/api/firmware-latest?filter=eq~~product~~unifi-os-server&filter=eq~~platform~~linux-arm64&filter=eq~~channel~~release" \
            -o linux-arm64.json
          jq empty linux-amd64.json
          jq empty linux-arm64.json

      - name: Extract version and download URLs
        id: version
        run: |
          set -euo pipefail
          for f in linux-amd64.json linux-arm64.json; do
            if [ "$(jq '._embedded.firmware | length' "$f")" -eq 0 ]; then
              echo "No firmware entries returned by Ubiquiti API ($f)" >&2
              exit 1
            fi
          done

          UOS_VERSION=$(jq -r '._embedded.firmware[0].version // empty' linux-amd64.json | sed 's/^v//')
          UOS_DOWNLOAD_AMD64=$(jq -r '._embedded.firmware[0]._links.data.href // empty' linux-amd64.json)
          UOS_DOWNLOAD_ARM64=$(jq -r '._embedded.firmware[0]._links.data.href // empty' linux-arm64.json)
          UOS_SHA256_AMD64=$(jq -r '._embedded.firmware[0].sha256_checksum // empty' linux-amd64.json)
          UOS_SHA256_ARM64=$(jq -r '._embedded.firmware[0].sha256_checksum // empty' linux-arm64.json)

          # Everything above is untrusted API data that flows into
          # $GITHUB_OUTPUT/$GITHUB_ENV, sed expressions, and a root-run
          # installer download. Validate strictly before writing any of it;
          # the anchored patterns also rule out embedded newlines.
          if ! [[ "$UOS_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected UOS version from API: $UOS_VERSION"
            exit 1
          fi
          for url in "$UOS_DOWNLOAD_AMD64" "$UOS_DOWNLOAD_ARM64"; do
            if ! [[ "$url" =~ ^https://fw-download\.ubnt\.com/[A-Za-z0-9._/-]+$ ]]; then
              echo "::error::Unexpected installer URL from API: $url"
              exit 1
            fi
          done
          for sum in "$UOS_SHA256_AMD64" "$UOS_SHA256_ARM64"; do
            if ! [[ "$sum" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::Missing or malformed sha256_checksum in API response"
              exit 1
            fi
          done

          {
            echo "UOS_VERSION=$UOS_VERSION"
            echo "UOS_DOWNLOAD_AMD64=$UOS_DOWNLOAD_AMD64"
            echo "UOS_DOWNLOAD_ARM64=$UOS_DOWNLOAD_ARM64"
            echo "UOS_SHA256_AMD64=$UOS_SHA256_AMD64"
            echo "UOS_SHA256_ARM64=$UOS_SHA256_ARM64"
          } | tee -a "$GITHUB_OUTPUT" "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Compare against pinned Dockerfile version
        id: release
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "Force flag set, running pipeline regardless of version match"
            echo "released=false" >> "$GITHUB_OUTPUT"
          elif grep -q "UOS_SERVER_VERSION=\"${UOS_VERSION}\"" docker/Dockerfile; then
            echo "UOS_SERVER_VERSION ${UOS_VERSION} already pinned, nothing to do"
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "New UOS_SERVER_VERSION ${UOS_VERSION} detected"
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  extract-linux-amd64:
    needs: release-check
    if: needs.release-check.outputs.RELEASED == 'false'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/extract-linux-amd64.yaml
    with:
      UOS_DOWNLOAD: ${{ needs.release-check.outputs.UOS_DOWNLOAD_AMD64 }}
      UOS_SHA256: ${{ needs.release-check.outputs.UOS_SHA256_AMD64 }}

  extract-linux-arm64:
    needs: release-check
    if: needs.release-check.outputs.RELEASED == 'false'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/extract-linux-arm64.yaml
    with:
      UOS_DOWNLOAD: ${{ needs.release-check.outputs.UOS_DOWNLOAD_ARM64 }}
      UOS_SHA256: ${{ needs.release-check.outputs.UOS_SHA256_ARM64 }}

  build-uosserver:
    needs: [release-check, extract-linux-amd64, extract-linux-arm64]
    if: needs.release-check.outputs.RELEASED == 'false'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-uosserver.yaml
    with:
      tag: ${{ needs.extract-linux-amd64.outputs.PODMAN_IMAGE_TAG }}

  open-update-pr:
    needs: [release-check, extract-linux-amd64, build-uosserver]
    if: needs.release-check.outputs.RELEASED == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      UOS_VERSION: ${{ needs.release-check.outputs.UOS_VERSION }}
      PODMAN_IMAGE_TAG: ${{ needs.extract-linux-amd64.outputs.PODMAN_IMAGE_TAG }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Bump Dockerfile and Chart for new UOS version
        run: |
          sed -i "s|^ARG UOSSERVER_TAG=.*|ARG UOSSERVER_TAG=${PODMAN_IMAGE_TAG}-multiarch|" docker/Dockerfile
          sed -i "s|^ENV UOS_SERVER_VERSION=.*|ENV UOS_SERVER_VERSION=\"${UOS_VERSION}\"|" docker/Dockerfile
          sed -i "s|^appVersion:.*|appVersion: \"${UOS_VERSION}\"|" chart/Chart.yaml
          # Patch-bump the chart version so chart-releaser publishes a new release.
          CHART_VERSION=$(awk '/^version:/ {print $2}' chart/Chart.yaml)
          MAJOR=$(echo "$CHART_VERSION" | cut -d. -f1)
          MINOR=$(echo "$CHART_VERSION" | cut -d. -f2)
          PATCH=$(echo "$CHART_VERSION" | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          sed -i "s|^version: .*|version: ${NEW_VERSION}|" chart/Chart.yaml
          echo "Chart bumped from ${CHART_VERSION} to ${NEW_VERSION}, appVersion ${UOS_VERSION}"

      - name: Open pull request
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump UniFi OS Server to ${{ env.UOS_VERSION }}"
          branch: bump/uos-${{ env.UOS_VERSION }}
          base: main
          title: "Bump UniFi OS Server to ${{ env.UOS_VERSION }}"
          body: |
            Automated bump:

            * `uosserver` base → `${{ env.PODMAN_IMAGE_TAG }}-multiarch`
            * `UOS_SERVER_VERSION` → `${{ env.UOS_VERSION }}`
            * Chart `appVersion` → `${{ env.UOS_VERSION }}`
            * Chart `version` patch-bumped (chart-releaser will publish on merge)

            Source: https://fw-update.ubnt.com/api/firmware-latest (release channel).
