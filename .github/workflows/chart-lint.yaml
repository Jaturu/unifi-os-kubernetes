---
name: Lint Helm chart

on:
  pull_request:
    paths:
      - 'chart/**'
      - 'examples/**'
      - '.github/workflows/chart-lint.yaml'
  push:
    branches: [main]
    paths:
      - 'chart/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.2

      - name: Helm dependency update
        run: helm dependency update chart/

      - name: Helm lint
        run: helm lint chart/

      - name: Render default values
        run: helm template unifi chart/ > /tmp/render-default.yaml

      - name: Render with ingress + optional ports enabled
        run: |
          helm template unifi chart/ \
            --set ingress.enabled=true \
            --set ingress.host=unifi.example.com \
            --set ports.networkApp.enabled=true \
            --set ports.hotspotSecured.enabled=true \
            --set ports.siteSupervisor.enabled=true \
            --set ports.aqmps.enabled=true \
            > /tmp/render-full.yaml

      - name: Render every optional port and check port names are unique
        run: |
          set -euo pipefail
          ARGS=()
          for p in $(yq '.ports | keys | .[]' chart/values.yaml); do
            ARGS+=(--set "ports.${p}.enabled=true")
          done
          helm template unifi chart/ "${ARGS[@]}" -s templates/deployment.yaml \
            > /tmp/render-ports.yaml
          DUPES=$(yq '.spec.template.spec.containers[0].ports[].name' /tmp/render-ports.yaml | sort | uniq -d)
          if [ -n "$DUPES" ]; then
            echo "::error::Duplicate container port names: $DUPES"
            exit 1
          fi
          LONG=$(yq '.spec.template.spec.containers[0].ports[].name' /tmp/render-ports.yaml | awk 'length > 15')
          if [ -n "$LONG" ]; then
            echo "::error::Port names over 15 characters: $LONG"
            exit 1
          fi

      - name: Render exporter, cert-manager and backups
        run: |
          helm template unifi chart/ \
            --set unifiExporter.enabled=true \
            --set unifiExporter.config.apiKey=dummy \
            --set unifiExporter.serviceMonitor.enabled=true \
            --set ingress.enabled=true \
            --set certManager.enabled=true \
            --set certManager.issuerRef.name=test \
            --set 'certManager.dnsNames={unifi.example.com}' \
            --set persistence.backups.enabled=true \
            --set gateway.enabled=true \
            --set 'gateway.hostnames={unifi.example.com}' \
            --set 'gateway.parentRefs[0].name=gw' \
            > /tmp/render-extras.yaml

      - name: Render example values
        run: |
          for f in examples/*.yaml; do
            echo "Rendering $f"
            helm template unifi chart/ -f "$f" > /dev/null
          done

      - name: Render with service labels + annotations
        # Pins the metadata merge: a per-port key overrides the global one, the
        # chart-owned port label survives a user attempt to set it, and no key
        # is ever emitted twice inside one metadata block.
        run: |
          set -euo pipefail
          helm template unifi chart/ --show-only templates/services.yaml \
            --set-string 'service.labels.pool=home' \
            --set-string 'service.labels.unifi-os-server\.io/port=hijacked' \
            --set-string 'service.labels.app\.kubernetes\.io/name=hijacked' \
            --set-string 'service.annotations.owner=infra' \
            --set-string 'ports.webui.labels.pool=dmz' \
            --set-string 'ports.webui.annotations.owner=webui' \
            > /tmp/render-labels.yaml

          # Flatten to "<service> <block> <key> <value>" tuples.
          awk '
            /^  name: /       { svc = $2; next }
            /^  labels:$/     { block = "labels";      next }
            /^  annotations:$/{ block = "annotations"; next }
            /^  [^ ]/         { block = "";            next }
            block && /^    /  { print svc, block, $1, $2 }
          ' /tmp/render-labels.yaml | tr -d '"' > /tmp/meta.txt

          expect() {
            grep -qxF "$1" /tmp/meta.txt || {
              echo "missing expected metadata: $1" >&2; cat /tmp/meta.txt >&2; exit 1
            }
          }
          expect 'unifi-unifi-os-server-webui labels pool: dmz'
          expect 'unifi-unifi-os-server-stun labels pool: home'
          expect 'unifi-unifi-os-server-webui labels unifi-os-server.io/port: webui'
          # Chart-owned identity labels must survive both the restructure and a
          # user override attempt -- spec.selector is built from these.
          expect 'unifi-unifi-os-server-webui labels app.kubernetes.io/name: unifi-os-server'
          expect 'unifi-unifi-os-server-webui labels app.kubernetes.io/instance: unifi'
          expect 'unifi-unifi-os-server-webui labels app.kubernetes.io/managed-by: Helm'
          expect 'unifi-unifi-os-server-webui annotations owner: webui'
          expect 'unifi-unifi-os-server-stun annotations owner: infra'

          dupes=$(awk '{print $1, $2, $3}' /tmp/meta.txt | sort | uniq -d)
          if [ -n "${dupes}" ]; then
            echo "duplicate keys emitted in a single metadata block:" >&2
            echo "${dupes}" >&2
            exit 1
          fi
          echo "service metadata merge OK"
