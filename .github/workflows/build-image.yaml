---
name: Build and publish unifi-os-server image

# Builds the application image (our entrypoint layered on top of the
# `uosserver` base) for both arches and publishes to GHCR.

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - '.github/workflows/build-image.yaml'
  release:
    types: [published]
  workflow_dispatch:

# Serialize this publish workflow so its mutable tags (latest, main, and the
# version tags) never race. Without a concurrency group, simultaneous runs
# push the same tags in parallel and `latest` can settle on whichever job
# finishes last rather than the newest commit. Grouping by workflow (not ref)
# also serializes release events against main pushes, which write those same
# shared tags. cancel-in-progress stays false so an in-progress build always
# runs to completion and publishes its immutable `sha-<commit>` image rather
# than being killed mid-publish. Caveat: GitHub keeps only the newest *pending*
# run per group, so a burst of pushes within one build window can supersede an
# intermediate commit's queued run before it starts — that commit then gets no
# sha image. Acceptable here, since only completed/announced shas are pinned.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/unifi-os-server

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read UOS version from Dockerfile
        id: uosver
        run: |
          UOS_VERSION=$(awk -F'"' '/^ENV UOS_SERVER_VERSION=/ {print $2}' docker/Dockerfile)
          if [ -z "$UOS_VERSION" ]; then
            echo "Could not parse UOS_SERVER_VERSION from docker/Dockerfile" >&2
            exit 1
          fi
          UOS_MAJOR_MINOR=$(echo "$UOS_VERSION" | cut -d. -f1-2)
          UOS_MAJOR=$(echo "$UOS_VERSION" | cut -d. -f1)
          {
            echo "uos_version=$UOS_VERSION"
            echo "uos_major_minor=$UOS_MAJOR_MINOR"
            echo "uos_major=$UOS_MAJOR"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve uosserver base image
        id: base
        # Build on this repo owner's own extracted base, regardless of the
        # Dockerfile default. Registry refs must be lowercase.
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/uosserver" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=${{ steps.uosver.outputs.uos_version }},enable={{ is_default_branch }}
            type=raw,value=${{ steps.uosver.outputs.uos_major_minor }},enable={{ is_default_branch }}
            type=raw,value=${{ steps.uosver.outputs.uos_major }},enable={{ is_default_branch }}
            type=raw,value=latest,enable={{ is_default_branch }}
          flavor: |
            latest=false

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: docker
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            UOSSERVER_IMAGE=${{ steps.base.outputs.image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
